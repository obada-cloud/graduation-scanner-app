<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Graduation QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#eef2f6;
  color:#173247;
}

.wrap{
  max-width:520px;
  margin:auto;
  padding:12px;
}

.card{
  background:#fff;
  border-radius:24px;
  padding:14px;
  box-shadow:0 10px 24px rgba(0,0,0,.10);
}

.btn{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  font-size:16px;
  font-weight:900;
  background:#7B1E1E;
  color:#fff;
  cursor:pointer;
}

#reader{
  width:100%;
  max-width:460px;
  height:72vh;
  min-height:560px;
  max-height:620px;

  margin:14px auto 0 auto;

  background:#eef2f5;
  border-radius:24px;
  overflow:hidden;

  border:4px solid #d9e0e7;

  box-shadow:
    0 18px 34px rgba(0,0,0,.10),
    inset 0 1px 0 rgba(255,255,255,.5);

  position:relative;
}

#reader::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:24px;
  pointer-events:none;
  box-shadow:
    inset 0 0 0 3px rgba(255,255,255,.25);
  z-index:2;
}

#reader video{
  width:100% !important;
  height:100% !important;

  object-fit:cover !important;

  border-radius:20px;

  transform:scale(1.01);
}

@media(max-width:700px){

  #reader{
    max-width:100%;
    height:74vh;
    min-height:520px;
    border-radius:22px;
  }

  #reader video{
    border-radius:18px;
  }
}

.resultBox{
  margin-top:14px;
  border-radius:20px;
  padding:18px;
  text-align:center;
  display:none;
  border:3px solid transparent;
}

.allowed{
  background:#e7f7eb;
  border-color:#2e7d32;
  color:#1b5e20;
}

.denied{
  background:#fdeaea;
  border-color:#c62828;
  color:#8e0000;
}

.processing{
  background:#eef4fb;
  border-color:#4f7e9e;
  color:#173247;
}

.resultTitle{
  font-size:34px;
  font-weight:900;
}

.resultText{
  margin-top:8px;
  font-size:15px;
  line-height:1.5;
  font-weight:700;
}

.status{
  margin-top:10px;
  text-align:center;
  font-size:12px;
  color:#60788b;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <button class="btn" id="startBtn" onclick="startScanner()">
      Start Scanner
    </button>

    <div id="reader"></div>

    <div class="status" id="statusText">
      Scanner is not started.
    </div>

    <div id="resultBox" class="resultBox">
      <div id="resultTitle" class="resultTitle"></div>
      <div id="resultReason" class="resultText"></div>
      <div id="resultStudent" class="resultText"></div>
      <div id="resultCard" class="resultText"></div>
    </div>

    <button id="nextBtn" class="btn" style="display:none;margin-top:18px;font-size:22px;padding:20px;" onclick="nextScan()">
      NEXT SCAN
    </button>

  </div>
</div>

<script>
const APPS_SCRIPT_EXEC_URL = "https://script.google.com/a/macros/inpsshakhbout.com/s/AKfycbwTweqxLbuJG9jogsH_05wl9SjM-amvPkciZ348YUe9qVWsqD7wTmnha_SrKUGYeBuj/exec";

const SESSION_TOKEN = new URLSearchParams(window.location.search).get("s") || "";

let scanner = null;
let busy = false;
let lastQr = "";
let lastScan = 0;
let started = false;

function setStatus(t){
  document.getElementById("statusText").innerText = t || "";
}

function vibratePattern(pattern){
  try{
    if(navigator.vibrate) navigator.vibrate(pattern);
  }catch(e){}
}

function showResult(res){
  const box = document.getElementById("resultBox");

  box.style.display = "block";

  document.getElementById("resultTitle").innerText =
    res.scanResult || "DENIED";

  document.getElementById("resultReason").innerText =
    res.reason || "";

  if(res.card){
    document.getElementById("resultStudent").innerText =
      (res.card.studentName || "") +
      " • " +
      (res.card.currentOwnerStudentNumber || "");

    document.getElementById("resultCard").innerText =
      "Card: " +
      (res.card.cardNumber || "");
  }else{
    document.getElementById("resultStudent").innerText = "";
    document.getElementById("resultCard").innerText = "";
  }

  if(res.scanResult === "ALLOWED"){
    box.className = "resultBox allowed";
    vibratePattern([180,80,180]);
  }else if(res.scanResult === "PROCESSING"){
    box.className = "resultBox processing";
  }else{
    box.className = "resultBox denied";
    vibratePattern([400,120,400]);
  }

  if(res.scanResult !== "PROCESSING"){
    document.getElementById("nextBtn").style.display = "block";
    setStatus("Tap NEXT SCAN when ready.");
  }
}

function jsonpValidate(url){
  return new Promise(function(resolve, reject){
    const callbackName =
      "scannerCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);

    const script = document.createElement("script");

    const timeout = setTimeout(function(){
      try{ delete window[callbackName]; }catch(e){}
      try{ script.remove(); }catch(e){}
      reject(new Error("Scanner API timeout. Please try again."));
    }, 9000);

    window[callbackName] = function(data){
      clearTimeout(timeout);
      delete window[callbackName];
      script.remove();
      resolve(data);
    };

    script.onerror = function(){
      clearTimeout(timeout);
      delete window[callbackName];
      script.remove();
      reject(new Error("Scanner API connection failed."));
    };

    script.src = url + "&callback=" + encodeURIComponent(callbackName);
    document.body.appendChild(script);
  });
}

async function validateQr(qr){
  const now = Date.now();

  if(qr === lastQr && (now - lastScan) < 2500){
    busy = false;
    return;
  }

  lastQr = qr;
  lastScan = now;

  setStatus("Processing...");

  try{
    if(!SESSION_TOKEN){
      throw new Error("Missing secure scanner session. Open scanner from DLM page.");
    }

    const parts = String(qr || "").split("|");
    const cardIdOnly = parts.length >= 2
      ? parts[1]
      : String(qr || "").trim();

    if(!cardIdOnly){
      throw new Error("Invalid QR code.");
    }

    showResult({
      scanResult:"PROCESSING",
      reason:"Validating card, please wait...",
      card:null
    });

    const url =
      APPS_SCRIPT_EXEC_URL +
      "?page=scanapi" +
      "&s=" + encodeURIComponent(SESSION_TOKEN) +
      "&cardId=" + encodeURIComponent(cardIdOnly) +
      "&t=" + encodeURIComponent(Date.now());

    const data = await jsonpValidate(url);

    showResult(data);
    setStatus("Ready for next scan.");

  }catch(err){
    showResult({
      scanResult:"DENIED",
      reason:String(err && err.message ? err.message : err)
    });
    setStatus("Validation failed.");
  }
}

async function startScanner(){
  if(started) return;

  setStatus("Starting camera...");
  document.getElementById("startBtn").disabled = true;
  document.getElementById("startBtn").innerText = "Starting...";

  try{
    if(scanner){
      try{
        await scanner.stop();
        await scanner.clear();
      }catch(e){}
    }

    scanner = new Html5Qrcode("reader", {
      verbose:false
    });

    const cameras = await Html5Qrcode.getCameras();

    if(!cameras || !cameras.length){
      throw new Error("No camera found.");
    }

    let cameraId = cameras[0].id;

    for(let i = 0; i < cameras.length; i++){
      const label = String(cameras[i].label || "").toLowerCase();

      if(
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment")
      ){
        cameraId = cameras[i].id;
        break;
      }
    }

    await scanner.start(
      cameraId,
      {
        fps: 20,
        qrbox: {
          width: 240,
          height: 240
        },
        aspectRatio: 1.777778,
        disableFlip: true
      },
      async function(decodedText){

        if(busy) return;

        busy = true;

        try{
          await scanner.pause(true);
        }catch(e){}

        validateQr(decodedText);
      },
      function(errorMessage){
        // ignore scan-frame errors
      }
    );

    started = true;
    setStatus("Scanner ready.");
    document.getElementById("startBtn").innerText = "Scanner Started";

  }catch(err){
    started = false;
    busy = false;
    document.getElementById("startBtn").disabled = false;
    document.getElementById("startBtn").innerText = "Start Scanner";
    showResult({
      scanResult:"DENIED",
      reason:String(err && err.message ? err.message : err)
    });
    setStatus("Camera failed to start.");
  }
}

async function nextScan(){
  document.getElementById("resultBox").style.display = "none";
  document.getElementById("nextBtn").style.display = "none";

  lastQr = "";
  busy = false;

  try{
    if(scanner){
      await scanner.resume();
    }
  }catch(e){}

  setStatus("Ready for next scan.");
}

document.addEventListener("visibilitychange", async function(){
  if(document.hidden) return;

  if(started && scanner && !busy){
    try{
      await scanner.resume();
    }catch(e){}
  }
});
</script>

</body>
</html>
