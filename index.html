<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>Graduation QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#eef2f6;
  color:#173247;
}

.topBar{
  background:#7B1E1E;
  color:#fff;
  padding:18px 16px;
  text-align:center;
  font-size:22px;
  font-weight:900;
}

.wrap{
  max-width:520px;
  margin:auto;
  padding:12px;
}

.card{
  background:#fff;
  border-radius:24px;
  padding:14px;
  box-shadow:0 10px 24px rgba(0,0,0,.10);
}

.btn{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  font-size:16px;
  font-weight:900;
  background:#7B1E1E;
  color:#fff;
  cursor:pointer;
}

#reader{
  width:100%;
  max-width:300px;
  height:300px;
  margin:12px auto 0 auto;
  background:#eef2f5;
  border-radius:18px;
  overflow:hidden;
  border:3px solid #d9e0e7;
}

.resultBox{
  margin-top:14px;
  border-radius:20px;
  padding:18px;
  text-align:center;
  display:none;
  border:3px solid transparent;
}

.allowed{
  background:#e7f7eb;
  border-color:#2e7d32;
  color:#1b5e20;
}

.denied{
  background:#fdeaea;
  border-color:#c62828;
  color:#8e0000;
}

.resultTitle{
  font-size:34px;
  font-weight:900;
}

.resultText{
  margin-top:8px;
  font-size:15px;
  line-height:1.5;
  font-weight:700;
}

.status{
  margin-top:10px;
  text-align:center;
  font-size:12px;
  color:#60788b;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <button class="btn" onclick="startScanner()">
      Start Scanner
    </button>

    <div id="reader"></div>

    <div class="status" id="statusText">
      Scanner is not started.
    </div>

    <div id="resultBox" class="resultBox">
      <div id="resultTitle" class="resultTitle"></div>
      <div id="resultReason" class="resultText"></div>
      <div id="resultStudent" class="resultText"></div>
      <div id="resultCard" class="resultText"></div>
    </div>
    <button id="nextBtn" class="btn" style="display:none;margin-top:18px;font-size:22px;padding:20px;" onclick="nextScan()">
      NEXT SCAN
    </button>
  </div>
</div>

<script>
const APPS_SCRIPT_EXEC_URL = "https://script.google.com/a/macros/inpsshakhbout.com/s/AKfycbwTweqxLbuJG9jogsH_05wl9SjM-amvPkciZ348YUe9qVWsqD7wTmnha_SrKUGYeBuj/exec";

const SESSION_TOKEN = new URLSearchParams(window.location.search).get("s") || "";

let scanner = null;
let busy = false;
let lastQr = "";
let lastScan = 0;

function setStatus(t){
  document.getElementById("statusText").innerText = t || "";
}

function showResult(res){
  const box = document.getElementById("resultBox");

  box.style.display = "block";

  document.getElementById("resultTitle").innerText =
    res.scanResult || "DENIED";

  document.getElementById("resultReason").innerText =
    res.reason || "";

  if(res.card){
    document.getElementById("resultStudent").innerText =
      (res.card.studentName || "") +
      " • " +
      (res.card.currentOwnerStudentNumber || "");

    document.getElementById("resultCard").innerText =
      "Card: " +
      (res.card.cardNumber || "");
  }else{
    document.getElementById("resultStudent").innerText = "";
    document.getElementById("resultCard").innerText = "";
  }

  if(res.scanResult === "ALLOWED"){
    box.className = "resultBox allowed";
    try {
  if (navigator.vibrate) {
    navigator.vibrate([180, 80, 180]);
  }
} catch(e) {}
  }else{
    box.className = "resultBox denied";
    if(navigator.vibrate) navigator.vibrate([400,120,400]);
  }

document.getElementById("nextBtn").style.display = "block";
setStatus("Tap NEXT SCAN when ready.");
}

function jsonpValidate(url){
  return new Promise(function(resolve, reject){
    const callbackName =
      "scannerCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);

    window[callbackName] = function(data){
      delete window[callbackName];
      script.remove();
      resolve(data);
    };

    const script = document.createElement("script");

    script.onerror = function(){
      delete window[callbackName];
      script.remove();
      reject(new Error("Scanner API connection failed."));
    };

    script.src = url + "&callback=" + encodeURIComponent(callbackName);

    document.body.appendChild(script);
  });
}

async function validateQr(qr){

  const now = Date.now();

  if(busy) return;

  if(qr === lastQr && (now - lastScan) < 6000){
    return;
  }

  busy = true;
  lastQr = qr;
  lastScan = now;

  setStatus("Validating QR code...");

  try{
    if(!SESSION_TOKEN){
      throw new Error("Missing secure scanner session. Open scanner from DLM page.");
    }

    const parts = String(qr || "").split("|");

    const cardIdOnly = parts.length >= 2
      ? parts[1]
      : String(qr || "").trim();

    const url =
      APPS_SCRIPT_EXEC_URL +
      "?page=scanapi" +
      "&s=" + encodeURIComponent(SESSION_TOKEN) +
      "&cardId=" + encodeURIComponent(cardIdOnly);

    const data = await jsonpValidate(url);

    showResult(data);
    setStatus("Ready for next scan.");

  }catch(err){
    showResult({
      scanResult:"DENIED",
      reason:String(err && err.message ? err.message : err)
    });

    setStatus("Validation failed.");
  }
}

async function startScanner(){
  setStatus("Starting camera...");

  if(scanner){
    try{
      await scanner.stop();
      await scanner.clear();
    }catch(e){}
  }

  scanner = new Html5Qrcode("reader");

  const cameras = await Html5Qrcode.getCameras();

  if(!cameras || !cameras.length){
    throw new Error("No camera found.");
  }

  let cameraId = cameras[0].id;

  for(let i = 0; i < cameras.length; i++){
    const label = String(cameras[i].label || "").toLowerCase();

    if(
      label.includes("back") ||
      label.includes("rear") ||
      label.includes("environment")
    ){
      cameraId = cameras[i].id;
      break;
    }
  }

  await scanner.start(
    cameraId,
      {
        fps: 15,
        qrbox: {
          width: 240,
          height: 240
        },
        aspectRatio: 1.0,
        disableFlip: false,
        experimentalFeatures: {
          useBarCodeDetectorIfSupported: true
        }
      }
    },
    function(decodedText){
      validateQr(decodedText);
    }
  );

  setStatus("Scanner ready.");
}

function nextScan(){
  document.getElementById("resultBox").style.display = "none";
  document.getElementById("nextBtn").style.display = "none";
  busy = false;
  setStatus("Ready for next scan.");
}
</script>

</body>
</html>
